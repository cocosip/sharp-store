[containers.filesystem]
backend = "filesystem"
tenant_mode = 0

[containers.filesystem.values]
root = "D:/sharp-store/data"
base_url = "https://files.example.test"

[containers.s3]
backend = "s3"
tenant_mode = 0

[containers.s3.values]
bucket = "s3-archive"
region = "ap-southeast-1"
endpoint = "https://s3.example.test"
access_key_id = "replace-with-access-key-id"
secret_access_key = "replace-with-secret-access-key"
session_token = ""
path_style = "true"

[containers.aws]
backend = "aws"
tenant_mode = 0

[containers.aws.values]
bucket = "aws-archive"
region = "ap-southeast-1"
endpoint = ""
access_key_id = ""
secret_access_key = ""
session_token = ""
path_style = "false"

[containers.minio]
backend = "minio"
tenant_mode = 0

[containers.minio.values]
bucket = "minio-archive"
endpoint = "minio.example.test:9000"
access_key = "replace-with-access-key"
secret_key = "replace-with-secret-key"
use_ssl = "true"
region = "us-east-1"

[containers.ks3]
backend = "ks3"
tenant_mode = 0

[containers.ks3.values]
bucket = "ks3-archive"
endpoint = "ks3-cn-beijing.ksyuncs.com"
access_key = "replace-with-access-key"
secret_key = "replace-with-secret-key"
protocol = "https"
region = "us-east-1"

[containers.azure]
backend = "azure"
tenant_mode = 0

[containers.azure.values]
connection_string = "DefaultEndpointsProtocol=https;AccountName=exampleaccount;AccountKey=replace-me;EndpointSuffix=core.windows.net"
container = "azure-archive"

[containers.aliyun]
backend = "aliyun"
tenant_mode = 0

[containers.aliyun.values]
endpoint = "https://oss-cn-hangzhou.aliyuncs.com"
bucket = "aliyun-archive"
access_key_id = "replace-with-access-key-id"
access_key_secret = "replace-with-access-key-secret"

[containers.obs]
backend = "obs"
tenant_mode = 0

[containers.obs.values]
endpoint = "https://obs.cn-north-4.myhuaweicloud.com"
bucket = "obs-archive"
access_key_id = "replace-with-access-key-id"
access_key_secret = "replace-with-access-key-secret"
